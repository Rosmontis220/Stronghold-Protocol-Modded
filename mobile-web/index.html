<body>
  <div id="app"></div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot__inner">
      <div class="boot__hex"></div>
      <div class="boot__text">STRONGHOLD PROTOCOL</div>
      <div id="boot-status" class="boot__status">正在校对本地资源…</div>
      <div id="boot-progress" class="boot__progress" aria-hidden="true"><span></span></div>
      <div id="boot-detail" class="boot__detail">首次启动会下载约 250 MB 素材，之后校对并复用本地资源。</div>
      <div id="boot-ready" class="boot__ready">音乐与字体就绪后即可使用，其他素材继续下载。</div>
      <div id="boot-download" class="boot__dl">
        <p class="boot__dl-head">下载内容 <span class="num" id="boot-dl-total"></span></p>
        <div class="boot__dl-row">
          <label class="boot__dl-opt"><input type="checkbox" id="boot-dl-audio" /> <span id="boot-dl-audio-label">音频</span></label>
          <label class="boot__dl-opt"><input type="checkbox" id="boot-dl-guide" /> <span id="boot-dl-guide-label">玩法说明教程页</span></label>
        </div>
        <p class="boot__dl-note" id="boot-dl-note"></p>
        <div class="boot__dl-local">
          <button type="button" class="boot__retry" id="boot-import">选择本地素材文件夹</button>
          <button type="button" class="boot__retry" id="boot-import-resume" hidden>继续使用上次的文件夹</button>
          <input type="file" id="boot-import-input" webkitdirectory directory multiple hidden />
          <span class="boot__dl-note" id="boot-import-note"></span>
        </div>
        <div class="boot__dl-btns">
          <button type="button" class="boot__retry" id="boot-dl-all">完整</button>
          <button type="button" class="boot__retry" id="boot-dl-lean">精简</button>
          <button type="button" class="boot__retry" id="boot-dl-go">保存并下载</button>
        </div>
      </div>
      <button id="boot-dl-toggle" class="boot__music" type="button" hidden>下载内容</button>
      <div class="boot__audio">
        <button id="boot-music" class="boot__music" type="button" aria-pressed="false">开启下载期间音乐</button>
        <button id="boot-mute" class="boot__music" type="button" aria-pressed="false">静音</button>
      </div>
      <button id="boot-retry" class="boot__retry" type="button" hidden>重新校对并进入游戏</button>
      <div id="boot-err" class="boot__err"></div>
    </div>
  </div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-hint__phone"></div>
    <div class="rotate-hint__title">请将设备横屏</div>
    <div>卫戍协议：盟约 需要横屏显示以获得完整体验</div>
    <div class="rotate-hint__micro">ROTATE DEVICE</div>
  </div>

  <noscript><p style="color:#c3cbc7;text-align:center;padding:40px">需要启用 JavaScript 才能运行本游戏。</p></noscript>
  <script>
    // Boot diagnostics (plain ES5: runs everywhere). A browser too old for the app says so instead of spinning forever:
    // no ES modules (nomodule below), a module graph that cannot load (e.g. import maps: Safari / iOS < 16.4), or no
    // a module graph that fails to link.
    window.__spBootFail = function (why) {
      var e = document.getElementById('boot-err');
      if (!e || e.getAttribute('data-final')) return;
      var im = false;
      try { im = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')); } catch (x) { im = false; }
      e.textContent = why === 'old' || !im
        ? '当前浏览器版本过旧，无法运行本游戏。请升级到 iOS / iPadOS 16.4+（Safari 16.4+）、Chrome / Edge 90+ 或 Firefox 108+ 后刷新。'
        : '游戏脚本加载失败，请检查网络连接后刷新页面。';
      e.setAttribute('data-final', '1');
    };
    // a module graph that fails to link (bare specifier without import-map support) reports here, not on the <script>
    window.addEventListener('error', function (ev) {
      var b = document.getElementById('boot');
      if (!b || b.classList.contains('is-done')) return;
      if (/specifier|resolve|import|module/i.test(String(ev && ev.message))) window.__spBootFail('load');
    });
  </script>
  <script type="module" src="/js/boot.js" onerror="window.__spBootFail && window.__spBootFail('load')"></script>
  <script nomodule>window.__spBootFail && window.__spBootFail('old');</script>
  <script>
    // Asset predownload can legitimately take several minutes on a first visit; only show a hint,
    // while the boot module owns the final error/retry state.
    setTimeout(function () {
      var b = document.getElementById('boot'), e = document.getElementById('boot-err'), s = document.getElementById('boot-status');
      if (b && !b.classList.contains('is-done') && e && !e.textContent && s && s.textContent === '正在校对本地资源…') s.textContent = '首次启动会校对并下载本地资源，请保持页面打开…';
    }, 30000);
  </script>
</body>
